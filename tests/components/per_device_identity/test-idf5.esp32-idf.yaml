esphome:
  name: pdi-test
  name_add_mac_suffix: true

external_components:
  - source:
      type: local
      path: ../../../components
    components: [per_device_identity]

esp32:
  variant: esp32c6
  framework:
    type: esp-idf
    version: 5.5.6
  partitions:
    - name: identity
      type: data
      subtype: nvs
      size: 0x6000

logger:

wifi:
  ssid: MySSID
  password: password1

mqtt:
  broker: mqtt.example.org
  port: 8883
  discovery: false
  certificate_authority: |
    -----BEGIN CERTIFICATE-----
    MIIBszCCAVoCCQDAAAAAAAAAADAKBggqhkjOPQQDAjAfMR0wGwYDVQQDDBRtcXR0
    -----END CERTIFICATE-----
  client_certificate: |
    -----BEGIN CERTIFICATE-----
    MIIBszCCAVoCCQDAAAAAAAAAADAKBggqhkjOPQQDAjAfMR0wGwYDVQQDDBRtcXR0
    -----END CERTIFICATE-----
  client_certificate_key: |
    -----BEGIN EC PRIVATE KEY-----
    MHcCAQEEIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAoAoGCCqGSM49
    -----END EC PRIVATE KEY-----

# ESP-IDF 5 (mbedTLS 3), every option at its default
per_device_identity:
